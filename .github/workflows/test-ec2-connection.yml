name: Test EC2 Connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Create test file
        run: |
          printf 'GitHub Actions EC2 test\nRun: %s\nTime: %s\n' \
            '${{ github.run_id }}' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > ec2-connection-test.txt

      - name: Configure SSH access
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.EC2_SSH_KEY }}' > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          cat <<'EOF' > ~/.ssh/config
          Host ec2-test-target
            HostName ${{ secrets.EC2_HOST }}
            User ${{ secrets.EC2_USERNAME }}
            Port ${{ secrets.EC2_PORT }}
            IdentityFile ~/.ssh/ec2_key
            ServerAliveInterval 30
            ServerAliveCountMax 5
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 30
          EOF

      - name: Verify SSH connectivity
        run: |
          ssh ec2-test-target "echo connected && hostname && pwd"

      - name: Copy tiny test file
        run: |
          target_dir="/home/${{ secrets.EC2_USERNAME }}/deployments/connection-test-${{ github.run_id }}"
          ssh ec2-test-target "mkdir -p '${target_dir}'"
          scp ec2-connection-test.txt ec2-test-target:"${target_dir}/ec2-connection-test.txt"

      - name: Verify file on EC2
        run: |
          ssh ec2-test-target "cat /home/${{ secrets.EC2_USERNAME }}/deployments/connection-test-${{ github.run_id }}/ec2-connection-test.txt"

name: Deploy To EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: antique-shop
  APP_SLUG: antique-shop
  DEPLOY_ROOT: /home/ec2-user/apps/antique-shop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create release archive
        run: |
          git archive --format=tar.gz --output=release.tar.gz HEAD

      - name: Copy release files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: "release.tar.gz,deploy/ec2-deploy.sh"
          target: "/home/${{ secrets.EC2_USERNAME }}/deployments/${{ github.run_id }}"

      - name: Run remote deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            chmod +x /home/${{ secrets.EC2_USERNAME }}/deployments/${{ github.run_id }}/deploy/ec2-deploy.sh
            APP_NAME="${{ env.APP_NAME }}" \
            APP_SLUG="${{ env.APP_SLUG }}" \
            DEPLOY_USER="${{ secrets.EC2_USERNAME }}" \
            DEPLOY_ROOT="${{ env.DEPLOY_ROOT }}" \
            /home/${{ secrets.EC2_USERNAME }}/deployments/${{ github.run_id }}/deploy/ec2-deploy.sh \
            /home/${{ secrets.EC2_USERNAME }}/deployments/${{ github.run_id }}/release.tar.gz

name: Deploy To EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: antique-shop
  APP_SLUG: antique-shop
  DEPLOY_ROOT: /home/ec2-user/apps/antique-shop

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: deploy-ec2-main
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create release archive
        run: |
          git archive --format=tar.gz --output=release.tar.gz HEAD

      - name: Configure SSH access
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.EC2_SSH_KEY }}' > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          cat <<'EOF' > ~/.ssh/config
          Host ec2-deploy-target
            HostName ${{ secrets.EC2_HOST }}
            User ${{ secrets.EC2_USERNAME }}
            Port ${{ secrets.EC2_PORT }}
            IdentityFile ~/.ssh/ec2_key
            ServerAliveInterval 30
            ServerAliveCountMax 10
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 30
          EOF

      - name: Copy release files to EC2
        shell: bash
        run: |
          set -euo pipefail
          target_dir="/home/${{ secrets.EC2_USERNAME }}/deployments/${{ github.run_id }}"
          ssh ec2-deploy-target "mkdir -p '${target_dir}/deploy'"

          for attempt in 1 2 3 4 5; do
            if scp release.tar.gz ec2-deploy-target:"${target_dir}/release.tar.gz" && \
               scp deploy/ec2-deploy.sh ec2-deploy-target:"${target_dir}/deploy/ec2-deploy.sh"; then
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "File copy failed after ${attempt} attempts." >&2
              exit 1
            fi

            echo "File copy attempt ${attempt} failed. Retrying in 20 seconds..." >&2
            sleep 20
          done

      - name: Run remote deploy
        shell: bash
        run: |
          set -euo pipefail
          ssh ec2-deploy-target "
            chmod +x /home/${{ secrets.EC2_USERNAME }}/deployments/${{ github.run_id }}/deploy/ec2-deploy.sh &&
            APP_NAME='${{ env.APP_NAME }}' \
            APP_SLUG='${{ env.APP_SLUG }}' \
            DEPLOY_USER='${{ secrets.EC2_USERNAME }}' \
            DEPLOY_ROOT='${{ env.DEPLOY_ROOT }}' \
            /home/${{ secrets.EC2_USERNAME }}/deployments/${{ github.run_id }}/deploy/ec2-deploy.sh \
            /home/${{ secrets.EC2_USERNAME }}/deployments/${{ github.run_id }}/release.tar.gz
          "
